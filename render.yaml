services:
  - type: web
    name: pro-utaggerbot
    runtime: python
    plan: starter
    numInstances: 1
    disk:
      name: pro-utaggerbot-data
      mountPath: /var/data
      sizeGB: 1
    buildCommand: pip install -r requirements.txt
    startCommand: python "pro_utaggerbot (2).py"
    healthCheckPath: /
    envVars:
      - key: API_ID
        value: "38640395"
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: CUSTOM_EMOJI_PACK
        sync: false
      - key: CLONE_TOKEN_ENCRYPTION_KEY
        sync: false